<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collatz FSM — mod 2^k</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
      #canvas { display: block; }
      #hud {
        position: fixed; top: 16px; left: 16px;
        background: rgba(0,0,0,0.7); border: 1px solid #444;
        padding: 12px 16px; border-radius: 6px; min-width: 200px;
        font-size: 13px; line-height: 2.0;
      }
      #hud .label { color: #888; }
      #hud .val   { color: #eee; font-weight: bold; }
      #controls {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 14px;
        background: rgba(0,0,0,0.7); border: 1px solid #444;
        padding: 10px 20px; border-radius: 6px;
      }
      #controls label { color: #aaa; font-size: 13px; }
      #k-slider { width: 160px; cursor: pointer; }
      .key-1 { color: #4caf50; }
      .key-3 { color: #2196f3; }
      .key-5 { color: #f44336; }
      .key-7 { color: #ff9800; }
      #navbar {
        position: fixed; top: 16px; right: 200px;
        font-size: 12px;
      }
      #navbar a { color: #aaa; text-decoration: none; }
      #navbar a:hover { color: #eee; }
      #tooltip {
        position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
        display: none; pointer-events: none;
        background: rgba(0,0,0,0.85); border: 1px solid #666;
        padding: 10px 14px; border-radius: 5px;
        font-size: 12px; line-height: 1.8; color: #eee;
        white-space: nowrap; min-width: 160px;
      }
    </style>
    <script type="module" crossorigin src="/collatz/apps/collatz-fsm-k/dist/assets/index-p5LDTwe7.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div><span class="label">M = 2^k, k = </span><span class="val" id="k-label">—</span></div>
      <div><span class="label">M = </span><span class="val" id="m-label">—</span></div>
      <div style="margin-top:8px; font-size:12px; line-height:1.8;">
        <span class="key-1">■ 1 mod 8</span>&nbsp;&nbsp;
        <span class="key-3">■ 3 mod 8</span><br>
        <span class="key-5">■ 5 mod 8</span>&nbsp;&nbsp;
        <span class="key-7">■ 7 mod 8</span>
      </div>
    </div>
    <div id="controls">
      <label for="k-slider">k =</label>
      <input id="k-slider" type="range" min="3" max="12" value="5" />
      <span class="val" id="k-label-ctrl">4</span>
      <span class="label">(M = <span id="m-label-ctrl">16</span>)</span>
      <label for="arc-toggle" style="margin-left:10px;">
        <input id="arc-toggle" type="checkbox" checked /> arcs
      </label>
      <label for="prune-toggle" style="margin-left:10px;">
        <input id="prune-toggle" type="checkbox" /> pruned
      </label>
    </div>
    <div id="navbar">
      <a href="https://github.com/wildducktheories/collatz" target="_blank">Collatz</a>
    </div>
    <div id="tooltip"></div>
  </body>
</html>
