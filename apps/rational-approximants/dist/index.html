<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rational Approximants — mediant tree norms</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
      #canvas { display: block; }
      #hud {
        position: fixed; top: 16px; left: 16px;
        background: rgba(0,0,0,0.7); border: 1px solid #444;
        padding: 12px 16px; border-radius: 6px; min-width: 220px;
        font-size: 13px; line-height: 2.0;
      }
      #hud .label { color: #888; }
      #hud .val   { color: #eee; font-weight: bold; }
      #controls {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 14px;
        background: rgba(0,0,0,0.7); border: 1px solid #444;
        padding: 10px 20px; border-radius: 6px;
      }
      #controls label { color: #aaa; font-size: 13px; }
      #d-slider { width: 140px; cursor: pointer; }
      #navbar {
        position: fixed; top: 16px; right: 16px;
        font-size: 18px; font-weight: bold;
      }
      #navbar a { color: #eee; text-decoration: none; }
      #navbar a:hover { text-decoration: underline; }
      #tooltip {
        position: fixed; display: none; pointer-events: none;
        background: rgba(0,0,0,0.85); border: 1px solid #666;
        padding: 8px 12px; border-radius: 5px;
        font-size: 12px; line-height: 1.8; color: #eee;
        white-space: nowrap; font-family: monospace; z-index: 100;
      }
      #kbd-hints {
        position: fixed; top: 52px; right: 16px;
        background: rgba(0,0,0,0.7); border: 1px solid #444;
        padding: 8px 14px; border-radius: 6px;
        font-size: 11px; line-height: 1.9; color: #888;
        white-space: nowrap;
      }
      #kbd-hints kbd {
        display: inline-block; background: #333; border: 1px solid #555;
        border-radius: 3px; padding: 0 5px; color: #ccc; font-family: monospace;
        font-size: 11px;
      }
    </style>
    <script type="module" crossorigin src="/collatz/apps/rational-approximants/dist/assets/index-s6LJtbLq.js"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div><span class="label">n = </span><span class="val" id="nmin-label">2</span><span class="label"> .. </span><span class="val" id="nmax-label">20</span></div>
      <div><span class="label">k = </span><span class="val" id="kmin-label">-19</span><span class="label"> .. </span><span class="val" id="kmax-label">19</span></div>
      <div><span class="label">depth = </span><span class="val" id="depth-label">12</span></div>
      <div><span class="label">points = </span><span class="val" id="pts-label">—</span></div>
      <div style="margin-top:8px; font-size:12px; line-height:1.8;">
        <span style="color:#ffeb3b">&#9632; r1, d=0</span><br>
        <span style="color:#4caf50">&#9632; r1, d odd</span><br>
        <span style="color:#2196f3">&#9632; r1, d even &gt; 0</span><br>
        <span style="color:#e91e63">&#9632; r0, d=0</span><br>
        <span style="color:#ff9800">&#9632; r0, d &ge; 1</span><br>
        <span style="color:#888888">&#9632; general</span>
      </div>
    </div>
    <div id="controls">
      <label>n_min
        <input id="nmin-slider" type="range" min="2" max="40" value="2" style="width:80px; cursor:pointer;" />
        <span class="val" id="nmin-val">2</span>
      </label>
      <label>n_max
        <input id="nmax-slider" type="range" min="2" max="40" value="20" style="width:80px; cursor:pointer;" />
        <span class="val" id="nmax-val">20</span>
      </label>
      <label>k_min
        <input id="kmin-slider" type="range" min="-39" max="39" value="-19" style="width:80px; cursor:pointer;" />
        <span class="val" id="kmin-val">-19</span>
      </label>
      <label>k_max
        <input id="kmax-slider" type="range" min="-39" max="39" value="19" style="width:80px; cursor:pointer;" />
        <span class="val" id="kmax-val">19</span>
      </label>
      <label>depth
        <input id="d-slider" type="range" min="4" max="30" value="12" style="width:80px;" />
        <span class="val" id="d-val">12</span>
      </label>
      <label><input id="r0-toggle" type="checkbox" checked /> show r0</label>
      <label><input id="lines-toggle" type="checkbox" checked /> lines</label>
      <label><input id="general-toggle" type="checkbox" checked /> general</label>
      <label><input id="norm-toggle" type="checkbox" /> norm</label>
    </div>
    <div id="navbar">
      <a href="https://github.com/wildducktheories/collatz" target="_blank">Rational Approximants</a>
    </div>
    <div id="tooltip"></div>
    <div id="kbd-hints">
      <kbd>+</kbd> / <kbd>-</kbd> &nbsp;depth up/down
    </div>
  </body>
</html>
